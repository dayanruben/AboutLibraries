name: Kotlin EAP validation

on:
  push:
    branches:
      - eap/kotlin
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/eap/kotlin' || github.head_ref == 'eap/kotlin' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Register installed JDK 11 toolchain
        run: echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_11_ARM64,JAVA_HOME_11_X64' >> "$HOME/.gradle/gradle.properties"
      - run: ./gradlew build -Pkotlin.native.ignoreDisabledTargets=true --stacktrace
